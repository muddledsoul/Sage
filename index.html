<body>
<title>Sage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a boutique look-book. Parchment ground, oxblood ink for headings, gold hardware as the one accent,
   herringbone band under the masthead, fabric-swatch cards in a responsive grid, sticky tab rail. */
:root{
  --ground:#f2eadd; --paper:#fbf6ee; --ink:#2b1d17; --muted:#77665a; --line:#dccfbb;
  --oxblood:#6e1f26; --olive:#55552f; --gold:#a5803a; --gold-soft:#e8d7b0; --choc:#4a3026;
  --on-ox:#fbf3e6;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:3px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#1b1411; --paper:#251b17; --ink:#efe4d4; --muted:#b09f8e; --line:#3e3029;
  --oxblood:#c9646b; --olive:#a7a76e; --gold:#d3ad62; --gold-soft:#4a3a22; --choc:#e0c9b3; --on-ox:#1b1411;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#1b1411; --paper:#251b17; --ink:#efe4d4; --muted:#b09f8e; --line:#3e3029;
  --oxblood:#c9646b; --olive:#a7a76e; --gold:#d3ad62; --gold-soft:#4a3a22; --choc:#e0c9b3; --on-ox:#1b1411;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Masthead */
.mast{padding-block:28px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mast h1{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(40px,8vw,64px);line-height:.95;margin:0;color:var(--oxblood);letter-spacing:-.01em}
.mast .sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.sizes-line{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.sizes-line b{color:var(--ink);font-weight:500}
.herring{height:12px;
  background:
   linear-gradient(135deg,var(--choc) 25%,transparent 25%) -6px 0/12px 12px,
   linear-gradient(225deg,var(--choc) 25%,transparent 25%) -6px 0/12px 12px,
   linear-gradient(315deg,var(--choc) 25%,transparent 25%) 0 0/12px 12px,
   linear-gradient(45deg,var(--choc) 25%,var(--gold-soft) 25%) 0 0/12px 12px;opacity:.55}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:14px 12px 12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tab .n{font-family:var(--f-mono);font-size:11px;letter-spacing:0;margin-left:4px;color:var(--gold)}

main{padding-block:22px 64px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar h2{font-family:var(--f-display);font-weight:500;font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
.bar .meta{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--oxblood);background:var(--oxblood);color:var(--on-ox);padding:10px 16px;border-radius:var(--r);font-size:13px;font-weight:600;letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--oxblood)}
.btn.sm{padding:6px 10px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--gold-soft)}

.status{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--paper);padding:12px 14px;border-radius:var(--r);margin-bottom:18px;font-size:14px}
.status[hidden]{display:none!important}
.spin{width:14px;height:14px;border:2px solid var(--gold-soft);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.status .grow{flex:1;min-width:0}

/* Grid of pieces */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.sw{aspect-ratio:5/4;max-width:100%;position:relative;--c1:#6e1f26;--c2:#3b2a22;--c3:#c9b48a}
.sw.prod{background:#fff}
.sw.prod img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.sw .finding{position:absolute;inset:auto 10px 10px auto;background:var(--paper);color:var(--muted);font-size:11px;padding:4px 8px;border-radius:2px;display:flex;gap:6px;align-items:center}
.sw.skel{background:linear-gradient(100deg,var(--paper) 30%,var(--gold-soft) 50%,var(--paper) 70%) 0 0/300% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-150% 0}}
@media (prefers-reduced-motion:reduce){.sw.skel{animation:none}}
.sw .skl{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.04em}
.sw .tag{position:absolute;left:10px;top:10px;background:var(--paper);color:var(--ink);font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:4px 8px;border-radius:2px}
.sw .newdot{position:absolute;right:10px;top:10px;background:var(--gold);color:#1b1411;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:2px}
.body{padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.brand{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.ttl{font-family:var(--f-display);font-size:19px;line-height:1.2;margin:0;text-wrap:balance}
.price{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.price .sz{color:var(--olive)}
.why{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.acts{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);padding:8px 8px 8px 10px;margin-top:auto}
.ico{border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ico:hover{background:var(--gold-soft);color:var(--ink)}
.ico[aria-pressed="true"]{color:var(--oxblood)}
.ico svg{width:19px;height:19px}
.shop{margin-left:auto;display:flex;gap:6px;align-items:center}
.shop a{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--oxblood);text-decoration:none;border:1px solid var(--oxblood);padding:6px 10px;border-radius:var(--r);white-space:nowrap}
.shop a.alt{border-color:var(--line);color:var(--muted);font-weight:500}
.more{padding:0 14px 12px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px}
.more a{color:var(--muted)}

/* Fabric swatches */
.t-herringbone{background:
  linear-gradient(135deg,var(--c1) 25%,transparent 25%) -9px 0/18px 18px,
  linear-gradient(225deg,var(--c1) 25%,transparent 25%) -9px 0/18px 18px,
  linear-gradient(315deg,var(--c1) 25%,transparent 25%) 0 0/18px 18px,
  linear-gradient(45deg,var(--c1) 25%,var(--c2) 25%) 0 0/18px 18px}
.t-plaid{background:
  repeating-linear-gradient(0deg,transparent 0 22px,color-mix(in srgb,var(--c2) 70%,transparent) 22px 30px,transparent 30px 52px,color-mix(in srgb,var(--c3) 60%,transparent) 52px 54px,transparent 54px 76px),
  repeating-linear-gradient(90deg,transparent 0 22px,color-mix(in srgb,var(--c2) 60%,transparent) 22px 30px,transparent 30px 52px,color-mix(in srgb,var(--c3) 60%,transparent) 52px 54px,transparent 54px 76px),var(--c1)}
.t-tapestry{background:
  radial-gradient(ellipse 22px 16px at 20% 30%,var(--c2) 60%,transparent 64%),
  radial-gradient(ellipse 18px 22px at 70% 22%,var(--c3) 58%,transparent 62%),
  radial-gradient(ellipse 26px 18px at 48% 68%,var(--c2) 58%,transparent 62%),
  radial-gradient(ellipse 14px 10px at 85% 75%,var(--c3) 60%,transparent 64%),
  radial-gradient(ellipse 12px 16px at 12% 82%,var(--c3) 60%,transparent 64%),
  radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c3) 30%,transparent) 1px,transparent 2px) 0 0/8px 8px,var(--c1);background-size:120px 100px,120px 100px,120px 100px,120px 100px,120px 100px,8px 8px,auto}
.t-croc{background:
  radial-gradient(ellipse at center,var(--c1) 52%,color-mix(in srgb,var(--c2) 85%,black) 58%) 0 0/24px 17px,
  radial-gradient(ellipse at center,var(--c1) 52%,color-mix(in srgb,var(--c2) 85%,black) 58%) 12px 8.5px/24px 17px,var(--c2)}
.t-knit{background:
  repeating-linear-gradient(90deg,var(--c1) 0 9px,color-mix(in srgb,var(--c1) 70%,black) 9px 10px),
  var(--c1);box-shadow:inset 0 -40px 60px -30px color-mix(in srgb,var(--c2) 40%,transparent)}
.t-boucle{background:
  radial-gradient(circle,var(--c2) 1.6px,transparent 2.4px) 0 0/7px 7px,
  radial-gradient(circle,var(--c3) 1.4px,transparent 2.2px) 3px 4px/9px 9px,var(--c1)}
.t-fur{background:
  repeating-linear-gradient(100deg,color-mix(in srgb,var(--c2) 45%,transparent) 0 2px,transparent 2px 5px),
  linear-gradient(165deg,var(--c1),var(--c2))}
.t-suede{background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c3) 35%,transparent),transparent 60%),linear-gradient(160deg,var(--c1),color-mix(in srgb,var(--c1) 70%,black))}
.t-leather{background:radial-gradient(ellipse at 30% 15%,color-mix(in srgb,white 28%,transparent),transparent 45%),linear-gradient(170deg,var(--c1),var(--c2))}
.t-satin{background:linear-gradient(115deg,var(--c1) 20%,color-mix(in srgb,var(--c1) 60%,white) 42%,var(--c1) 58%,var(--c2) 100%)}
.t-solid{background:linear-gradient(160deg,var(--c1),var(--c2))}

/* Style page */
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0 0 10px}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:16px 0 8px}
.summary{font-family:var(--f-display);font-style:italic;font-size:19px;line-height:1.45;margin:0;max-width:62ch}
.pal{display:flex;flex-wrap:wrap;gap:10px}
.pal div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);width:64px;text-align:center}
.pal span{width:44px;height:44px;border-radius:50%;border:1px solid var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--ground)}
.pill.no{text-decoration:line-through;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
@media (max-width:420px){.form{grid-template-columns:1fr}}
.form label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.form input,.form select{border:1px solid var(--line);background:var(--ground);border-radius:var(--r);padding:9px 10px;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);font-family:var(--f-mono);min-width:0}
.form .full{grid-column:1/-1}
.szf{display:flex;flex-direction:column;gap:4px;min-width:0}
.szl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rng{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.rng select{flex:1;min-width:0;border:1px solid var(--line);background:var(--ground);border-radius:var(--r);padding:9px 6px;font-size:15px;color:var(--ink);font-family:var(--f-mono)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ph{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph img{aspect-ratio:3/4;object-fit:cover;width:100%;display:block;background:var(--line)}
.ph .noimg{aspect-ratio:3/4;display:grid;place-items:center;color:var(--muted);font-size:12px;background:var(--ground)}
.ph .cap{padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.ph .cap b{font-weight:600;font-size:12.5px}
.ph .cap .t{color:var(--muted)}
.ph .rm{border:0;background:none;color:var(--muted);font-size:11px;text-align:left;padding:0;text-decoration:underline}
.ph .rm.armed{color:var(--oxblood);font-weight:600}
.upload{border:1.5px dashed var(--gold);border-radius:var(--r);display:grid;place-items:center;text-align:center;padding:16px;min-height:160px;color:var(--oxblood);background:transparent;font-size:13px;font-weight:600;gap:6px}
.upload small{color:var(--muted);font-weight:400}

/* Lists */
.lists{display:flex;flex-direction:column;gap:22px}
.listhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.listhead h3{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0}
.listhead .c{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.listhead .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline}
.listhead .x.armed{color:var(--oxblood);font-weight:600}
.newlist{display:flex;gap:8px;flex-wrap:wrap}
.newlist input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:9px 12px}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty p{max-width:46ch;margin:6px auto 0}
.empty b{font-family:var(--f-display);font-weight:500;font-size:20px;color:var(--ink)}

/* Sheet for adding to lists */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#140d0a 55%,transparent);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:min(520px,100%);border-radius:10px 10px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:80vh;overflow:auto}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:8px}}
.sheet h3{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--ground)}
.opt input{width:18px;height:18px;accent-color:var(--oxblood)}

.foot{border-top:1px solid var(--line);margin-top:8px}
.foot .wrap{padding-block:16px 28px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.foot b{color:var(--ink);font-weight:500}
.foot .upd{font-family:var(--f-body);border:1px solid var(--gold);background:var(--gold-soft);color:var(--ink);border-radius:var(--r);padding:5px 10px;font-size:12px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.sample{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
</style>

<header class="wrap mast">
  <div>
    <h1>Sage</h1>
    <div class="sub">Sage advice · hand-picked pieces &amp; where to buy them</div>
  </div>
  <div class="sizes-line" id="sizesLine">Sizes not set yet</div>
</header>
<div class="herring" aria-hidden="true"></div>
<nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist" id="tabs"></div></nav>
<main class="wrap" id="main"></main>
<footer class="foot"><div class="wrap" id="foot"></div></footer>
<div id="layer"></div>

<script>
(() => {
const APP_VERSION = "1.7.0";

  denim:Array.from({length:12},(_,i)=>String(23+i)),

};
function splitSize(v){ const m=String(v||"").split(/\s*[–-]\s*/); return [m[0]||"",m[1]||""]; }
const CAT_SIZE = {Outerwear:"outerwear",Knitwear:"tops",Tops:"tops",Skirts:"bottoms",Pants:"bottoms",Dresses:"dresses",Shoes:"shoes"};
const DAY = 864e5;

const S = {db:null,sample:null,assets:null,user:null,canWrite:true,ready:false,offline:false,
  profile:null,items:[],photos:[],lists:[],tab:"picks",cat:"All",busy:"",ctl:null,armed:null,sheet:null,autoRan:false};

// Example content shown only until the live store answers (or when opened outside Claude).
const EXAMPLE = {
  style:{summary:"Heritage tailoring with a romantic, vintage streak: equestrian herringbone, tapestry florals and military braid, warmed by oxblood, chocolate and olive, finished in gold hardware.",
    palette:[{name:"Oxblood",hex:"#6e1f26"},{name:"Chocolate",hex:"#4a3026"},{name:"Olive",hex:"#55552f"},{name:"Camel",hex:"#a88b62"},{name:"Cream",hex:"#efe6d4"}],
    fabrics:["herringbone","tapestry jacquard","boucle"],silhouettes:["mini skirts"],details:["gold hardware"],brands:["French Connection"],avoid:[]},
  items:[{id:"ex1",title:"Herringbone mini skirt with horsebit trim",brand:"& Other Stories",category:"Skirts",estPrice:"$90–$130",why:"Same equestrian buckle detail she stopped for at French Connection.",query:"herringbone mini skirt gold horsebit",colors:["#7b6656","#d8ccb8","#a5803a"],texture:"herringbone",status:"new",createdAt:Date.now()}]
};

const $ = (s,r=document)=>r.querySelector(s);

/* ---------- shop links ---------- */
const BRAND_SITES = [
  [/^zara/i,"Zara","https://www.zara.com/us/en/search?searchTerm="],
  [/free people/i,"Free People","https://www.freepeople.com/search/?q="],
  [/anthropologie|maeve/i,"Anthropologie","https://www.anthropologie.com/search?q="],
  [/french connection|avec les filles|kurt geiger|sam edelman|steve madden/i,"Macy's","https://www.macys.com/shop/search?keyword="],
];
function links(it){
  const q = (it.query || `${it.brand} ${it.title}`).trim();
  const out = [];
  if (/^https:\/\//.test(it.url||"")) { let host=""; try{ host=new URL(it.url).hostname.replace(/^www\./,""); }catch{} out.push({label:"Buy",href:it.url,main:true,host,retailer:it.retailer}); out.push({label:"Google Shopping",href:"https://www.google.com/search?tbm=shop&q="+enc(q)}); }
  else out.push({label:"Shop",href:"https://www.google.com/search?tbm=shop&q="+enc(q),main:true});
  for (const [re,label,base] of BRAND_SITES) if (re.test(it.brand||"")) { out.push({label,href:base+enc(q)}); break; }
  out.push({label:"Nordstrom",href:"https://www.nordstrom.com/sr?keyword="+enc(q)});
  out.push({label:"Pre-loved",href:"https://poshmark.com/search?query="+enc(q)});
  return out;
}

async function checkVersion(){
  if (!S.local) return;
  try { const r = await fetch("version.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return; const v=(await r.json()).version;
    const n = x=>String(x).split(".").map(Number); const a=n(v), b=n(APP_VERSION);
    for (let i=0;i<3;i++){ if((a[i]||0)>(b[i]||0)){ S.newer=v; footer(); toast(`Version ${v} is available. Tap Update at the bottom.`); return; } if((a[i]||0)<(b[i]||0)) return; }

}

/* ---------- data ---------- */
async function saveProfile(patch){
  const ref = S.db.doc("app/profile");
  if (S.profile) await ref.update(patch); else await ref.set(patch);
}
async function setItem(id,patch){ try { await S.db.doc("items/"+id).update(patch); } catch(e){ toast("Couldn't save that change."); } }

function subscribe(){
  let got=0; const timer=setTimeout(()=>{ if(!S.ready){ S.ready=true; render(); toast("Still connecting. Showing what's saved so far."); } },10000);
  const done=()=>{ if(++got>=4 && !S.ready){ S.ready=true; clearTimeout(timer); render(); maybeAuto(); setTimeout(autoFind,300); setTimeout(refillBuffer,2500); } else if (S.ready) render(); };
  const onErr = e => { if(e?.code==="revoked"){ S.canWrite=false; } clearTimeout(timer); S.ready=true; render(); };
  let p=false,i=false,ph=false,l=false;
  S.db.doc("app/profile").onSnapshot(s=>{ S.profile = s.exists ? {...s.data()} : null; if(!p){p=true;done();} else render(); }, onErr);
  S.db.collection("items").orderBy("createdAt","desc").limit(500).onSnapshot(s=>{ S.items=s.docs.map(d=>({id:d.id,...d.data()})); if(!i){i=true;done();} else render(); }, onErr);
  S.db.collection("photos").orderBy("createdAt","desc").limit(200).onSnapshot(s=>{ S.photos=s.docs.map(d=>({id:d.id,...d.data()})); if(!ph){ph=true;done();} else render(); }, onErr);
  S.db.collection("lists").orderBy("createdAt","asc").limit(100).onSnapshot(s=>{ S.lists=s.docs.map(d=>({id:d.id,...d.data()})); if(!l){l=true;done();} else render(); }, onErr);
}
function maybeAuto(){

Reply with only a JSON array of ${n} objects:

async function generateIdeas(n,status,signal){

      estPrice:String(r.estPrice||"").slice(0,30),why:String(r.why||"").slice(0,200),query:String(r.query||`${r.brand} ${r.title}`).slice(0,120),

const queued = () => S.items.filter(i=>i.status==="queued");
const readyScore = i => (i.url&&i.image?2:i.url?1:0) + (S.local? (i.lookedUp?0:-1) : 0);

async function getPicks(auto){
  if (!S.sample || S.busy) return;
  let stock = queued().filter(i=>!IMGFAIL.has(i.id)).sort((a,b)=>readyScore(b)-readyScore(a) || a.createdAt-b.createdAt);
  if (S.local) { const ready = stock.filter(i=>i.url && i.image); if (ready.length) stock = ready; }
  if (stock.length) {
    const take = stock.slice(0,8), now = Date.now();
    for (let k=0;k<take.length;k++) await S.db.doc("items/"+take[k].id).update({status:"new",createdAt:now+k,batch:now});
    await saveProfile({lastFeedAt:now});
    S.tab="picks"; S.cat="All"; render(); scrollTo({top:0});
    toast(`${take.length} new picks`);
    const unlooked = take.filter(i=>S.local && !i.lookedUp).map(i=>i.id);
    if (unlooked.length) lookupPool(unlooked);
    setTimeout(refillBuffer,500);
    return;
  }
  const signal = stopable(auto ? "Pulling today's picks in her style…" : "Finding new pieces in her style…");
  let ids=[];
  try {
    ids = await generateIdeas(8,"new",signal);

  } catch(e){ if (e?.code!=="cancelled") toast(errCopy(e)); }

  setTimeout(refillBuffer,1500);
}

/* Background restock: keeps ~30 picks ready (looked up, with photos) so "Get new picks" is instant */
async function refillBuffer(){
  if (!S.sample || !S.canWrite || BG.refilling) return;
  if (queued().length >= BUF.low) { if (S.local) lookupPool(queued().filter(i=>!i.lookedUp).map(i=>i.id)); return; }
  BG.refilling = true; bgNote();
  try {
    let rounds = 0;
    while (queued().length < BUF.target && rounds < 3 && !BG.stopped) {
      rounds++;
      const ids = await generateIdeas(BUF.chunk,"queued",BG.signal());
      await new Promise(r=>setTimeout(r,300));
      if (S.local) await lookupPool(ids);
    }
  } catch(e) { if (e?.code==="rate_limited") toast("Restocking paused: the API is rate limited. It will resume next time."); }
  finally { BG.refilling = false; bgNote(); }
}
async function refineStyle(){
  if (!S.sample || S.busy && !S.busy.startsWith("Refin")) return;

  const prompt = `You are a fashion stylist writing a style profile for Sage, from evidence about what she loves.

Photos of pieces she was drawn to: ${c.photos.join(" | ") || "none"}
Suggested pieces she saved: ${c.favs.join("; ") || "none"}
Suggested pieces she rejected: ${c.nos.join("; ") || "none"}
Update the profile so it reflects all of this evidence, weighting recent photos and saves. Keep what still holds; sharpen; add "avoid" items learned from rejections.
Reply with only a JSON object: {"summary": 1-2 sentences describing her style, "palette": 5-7 objects {"name","hex"}, "fabrics": up to 8 strings, "silhouettes": up to 6, "details": up to 8, "brands": up to 10 brands she'd like, "avoid": up to 6}`;

async function findListing(it,signal,o={}){
  const q = `Find this exact clothing piece for sale online right now in the US:
Brand: ${it.brand}
Piece: ${it.title}
Search phrase: ${it.query||""}
${it.tagText?`Tag: ${it.tagText}`:""}
Search for it, then fetch the best-matching product page (the brand's own site or a major retailer such as Macy's, Nordstrom, Bloomingdale's, Revolve, Free People, Anthropologie). From the fetched page copy the product's photo URLs exactly as they appear in the page content (direct https image links from the retailer's image CDN, e.g. og:image or the main gallery). Never construct or guess an image URL. Also take the current price and the exact listed product name. If the exact piece is sold out or not found, use the closest in-stock match from the same brand and say so in "match".
${o.avoid?`The page ${o.avoid} did not give a usable product photo. Use a DIFFERENT store's page for this piece (or the closest in-stock match) whose product photo link appears in the page content.\n`:""}Reply with only a JSON object: {"url": product page URL or null, "image": best product image URL copied from the page or null, "images": up to 3 more product image URLs copied from the page, "price": current price like "$128" or null, "retailer": store name, "title": listed product name, "match": "exact" or "close" or "none"}`;
  const r = await S.sample.json(q,{signal,search:true,searchUses:3,fetch:2,model:o.thorough?(LS.get("sage.model")||"claude-sonnet-5-5"):(LS.get("sage.lookupModel")||"claude-haiku-5-5")});
  const patch = {lookedUp:Date.now()};
  if (r && /^https:\/\//.test(r.url||"")) {
    patch.url=String(r.url).slice(0,600);
    if (/^https:\/\//.test(r.image||"")) patch.image=String(r.image).slice(0,800);
    patch.images=(Array.isArray(r.images)?r.images:[]).filter(u=>/^https:\/\//.test(u||"")).map(u=>String(u).slice(0,800)).slice(0,3);
    patch.ogTried=null;
    if (r.price) patch.listedPrice=String(r.price).slice(0,20);
    if (r.retailer) patch.retailer=String(r.retailer).slice(0,40);
    if (r.match) patch.match=String(r.match).slice(0,10);
    if (r.title && it.source!=="photo") patch.title=String(r.title).slice(0,120);
  }
  if (o.avoid && patch.url===o.avoid) delete patch.url;
  await S.db.doc("items/"+it.id).update(patch);
  IMGFAIL.delete(it.id); PREVIEW.seen.delete(it.id);
  if (S.owed && it.status==="queued" && patch.url && patch.image) { S.owed--; try { await S.db.doc("items/"+it.id).update({status:"new",createdAt:Date.now(),batch:Date.now()}); } catch {} }
  if (!patch.url && it.source!=="photo" && (it.status==="new"||it.status==="queued")) { if (it.photoRetry || o.thorough) retire(it.id); else noPhoto(it.id); }
  return !!patch.url;
}
const BG = {ctl:null,refilling:false,active:0,pending:[],stopped:false,inflight:new Set(),
  signal(){ if(!this.ctl||this.ctl.signal.aborted) this.ctl=new AbortController(); return this.ctl.signal; }};
function bgNote(){ const el=$("#bgnote"); if(el) el.innerHTML = bgText(); }
function bgText(){
  const ready = queued().length;
  const work = BG.inflight.size || BG.pending.length ? `Looking up ${BG.inflight.size+BG.pending.length} listing${BG.inflight.size+BG.pending.length===1?"":"s"}` : BG.refilling ? "Restocking picks" : "";
  return (ready?`${ready} more ready`:"") + (work?`${ready?" · ":""}${work}… <a href="#" data-act="stopbg">Pause</a>`:"");
}
const POOLOPT = new Map();
function lookupPool(ids,opt){
  if (!S.local || !S.sample) return Promise.resolve();
  BG.stopped = false;
  if (opt) ids.forEach(id=>POOLOPT.set(id,opt));
  const fresh = ids.filter(id=>!BG.inflight.has(id) && !BG.pending.includes(id));
  BG.pending.push(...fresh);
  bgNote();
  return new Promise(resolve=>{
    const conc = Number(LS.get("sage.conc")||3);
    const tick = () => {
      if (!BG.pending.length && !BG.inflight.size) { bgNote(); return resolve(); }
      while (!BG.stopped && BG.inflight.size < conc && BG.pending.length) {
        const pri = BG.pending.findIndex(x=>{ const t=S.items.find(i=>i.id===x); return t && t.status!=="queued"; });
        const id = BG.pending.splice(pri>=0?pri:0,1)[0]; const it = S.items.find(x=>x.id===id);
        if (!it) continue;
        BG.inflight.add(id); S.finding = id; render();
        findListing(it,BG.signal(),POOLOPT.get(id)||{}).catch(async e=>{
          if (e?.code==="rate_limited") { BG.pending.unshift(id); LS.set("sage.conc","2"); await new Promise(r=>setTimeout(r,20000)); }
          else if (e?.code==="bad_key") { BG.stopped=true; BG.pending=[]; toast(errCopy(e)); }
          else if (e?.code!=="cancelled") { try{ await S.db.doc("items/"+id).update({lookedUp:Date.now()}); }catch{} }
        }).finally(()=>{ POOLOPT.delete(id); BG.inflight.delete(id); if(S.finding===id) S.finding=null; render(); tick(); });
      }
      if (BG.stopped && !BG.inflight.size) { BG.pending=[]; bgNote(); resolve(); }
    };
    tick();
  });
}
async function runFinder(ids){ await lookupPool(ids); }
function autoFind(){
  if (!S.local || !S.sample || S.autoFound) return;
  S.autoFound = true;
  const need = S.items.filter(i=>i.status!=="no" && i.status!=="queued" && !i.url && !i.lookedUp);
  need.sort((a,b)=>(a.source==="photo")-(b.source==="photo"));
  if (need.length) lookupPool(need.slice(0,12).map(i=>i.id));
  setTimeout(refillBuffer,2000);
}
/* Product photo loading: direct → image relay → page preview image → swatch */
const relay = u => "https://images.weserv.nl/?url="+enc(u)+"&w=700&we&output=jpg";
function imgChain(it){
  const raw = [it.image,...(Array.isArray(it.images)?it.images:[])].filter(u=>/^https:\/\//.test(u||""));
  const out=[]; for (const u of [...new Set(raw)]) { out.push(u); if (!u.startsWith("https://images.weserv.nl")) out.push(relay(u)); }
  return out;
}
document.addEventListener("error", ev => {
  const im = ev.target;
  if (!(im instanceof HTMLImageElement) || !im.dataset.c) return;
  const c = JSON.parse(im.dataset.c); const i = Number(im.dataset.i)+1;
  if (i < c.length) { im.dataset.i = i; im.src = c[i]; return; }
  const id = im.dataset.item; im.remove();
  const it = S.items.find(x=>x.id===id);
  if (it && it.url && !it.ogTried && !PREVIEW.seen.has(id)) { queuePreview(id); return; }
  IMGFAIL.add(id); noPhoto(id);
}, true);
const IMGFAIL = new Set();
/* No working photo: one thorough retry on a different store, then swap the pick out */
async function noPhoto(id){
  const it = S.items.find(x=>x.id===id);
  if (!it || it.source==="photo" || !S.local || it.status==="nolisting" || BG.inflight.has(id) || BG.pending.includes(id)) return;
  if (!it.photoRetry) {
    IMGFAIL.delete(id); PREVIEW.seen.delete(id);
    try { await S.db.doc("items/"+id).update({photoRetry:Date.now(),ogTried:null}); } catch {}
    lookupPool([id],{thorough:true,avoid:it.url});
  } else retire(id);
}
const RETIRED = new Set();
async function retire(id){
  const it = S.items.find(x=>x.id===id); if (!it || it.source==="photo" || it.status==="fav" || RETIRED.has(id)) return;
  RETIRED.add(id);
  const wasShown = it.status==="new";
  try { await S.db.doc("items/"+id).update({status:"nolisting"}); } catch { return; }
  if (wasShown) {
    const rep = queued().filter(i=>i.url && i.image && !IMGFAIL.has(i.id)).sort((a,b)=>a.createdAt-b.createdAt)[0];
    if (rep) { try { await S.db.doc("items/"+rep.id).update({status:"new",createdAt:it.createdAt,batch:it.batch||Date.now()}); } catch {} }
    else S.owed = (S.owed||0)+1;
  }
}
const PREVIEW = {queue:[],seen:new Set(),running:0};
function queuePreview(id){
  if (!S.local || PREVIEW.seen.has(id)) return;
  PREVIEW.seen.add(id); PREVIEW.queue.push(id); setTimeout(pumpPreview,0);
}
async function pumpPreview(){
  while (PREVIEW.running < 2 && PREVIEW.queue.length){
    const id = PREVIEW.queue.shift(); const it = S.items.find(x=>x.id===id); if (!it?.url) continue;
    PREVIEW.running++;
    (async () => {
      const patch = {ogTried:Date.now()};
      try {
        const r = await fetch("https://api.microlink.io/?url="+enc(it.url));
        const j = await r.json();
        const img = j?.data?.image?.url;
        if (j?.status==="success" && /^https:\/\//.test(img||"") && img!==it.image) { patch.image = img; patch.images = [...new Set([...(it.images||[]),...(it.image?[it.image]:[])])].slice(0,4); }
      } catch {}
      try { await S.db.doc("items/"+id).update(patch); } catch {}
    })().finally(()=>{ PREVIEW.running--; pumpPreview(); });
  }
}
async function ensureHandPicked(){
  if (S.lists.some(l=>l.id==="hand-picked")) return;
  try { const r=S.db.doc("lists/hand-picked"); const g=await r.get(); if(!g.exists) await r.set({name:"Sage’s Hand Picked",createdAt:0,fixed:true}); } catch {}
}
async function downscale(file,max=1600){
  try {
    const bmp = await createImageBitmap(file,{imageOrientation:"from-image"});
    const k = Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv = document.createElement("canvas"); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",.85));
  } catch { return file; }
}
async function addPhotos(files){

      if (S.assets) { try { assetId = (await S.assets.upload(blob,{type:"image/jpeg"})).id; } catch(e){ if(e?.code==="quota_or_state") toast("Photo storage is full. Remove a few photos."); } }
      const a = await S.sample.json(`This photo was taken in a store (often Macy's Herald Square, NYC) of a piece Sage was drawn to: clothing, shoes or a bag. Identify the exact piece so it can be bought online later. Read any visible tag, label or sign: brand, style number, color name, price. If several pieces are in frame, pick the most prominent one being held or featured.
Reply with only a JSON object: {"item": short name like "Herringbone mini skirt", "title": a precise product-style name as the retailer would list it, "brand": brand from a tag, label or sign, else your best guess with "(likely)" appended, or null, "category": one of ${JSON.stringify(CATS)}, "tagText": style number and/or price read off the tag (e.g. "Style 78OA2 · $118") or null, "estPrice": price range like "$90–$130" (use the tag price if visible), "query": a precise 4-10 word shopping search that finds THIS piece online (brand, product type, key fabric/detail/color, style number if read), "colors": 2-4 hex colors, "tags": 5-8 short descriptive tags (fabric, pattern, silhouette, hardware), "note": one sentence on what makes it appealing}`,
        {images:[blob],signal,cache:false});
      const analysis = {item:String(a?.item||"Saved piece").slice(0,80),brand:a?.brand?String(a.brand).slice(0,60):null,category:CATS.includes(a?.category)?a.category:null,
        colors:(a?.colors||[]).map(hex).filter(Boolean).slice(0,4),tags:(a?.tags||[]).map(t=>String(t).slice(0,30)).slice(0,8),note:String(a?.note||"").slice(0,200)};
      const now = Date.now();
      const pref = await S.db.collection("photos").add({assetId,analysis,createdAt:now});
      await ensureHandPicked();
      const brand = analysis.brand || "Unknown brand";
      await S.db.collection("items").add({source:"photo",photoId:pref.id,photoAsset:assetId,
        title:String(a?.title||analysis.item).slice(0,120),brand,category:analysis.category||"Accessories",
        estPrice:String(a?.estPrice||"").slice(0,30),tagText:a?.tagText?String(a.tagText).slice(0,60):null,
        why:analysis.note,query:String(a?.query||`${brand} ${analysis.item}`).replace(/\(likely\)/g,"").slice(0,140),
        colors:analysis.colors.slice(0,3),texture:"solid",url:/^https:\/\//.test(a?.url||"")?String(a.url).slice(0,500):null,status:"fav",lists:["hand-picked"],createdAt:now});

  }

  if (added) { toast(`${added} piece${added===1?"":"s"} added to Sage’s Hand Picked`); await refineStyle();
    if (S.local) runFinder(S.items.filter(i=>i.source==="photo" && !i.url && !i.lookedUp).slice(0,added).map(i=>i.id)); }
}

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act==="closesheet" && ev.target.closest("[data-stop]") && el.classList.contains("scrim")) return;
  const act = el.dataset.act; const id = el.closest("[data-id]")?.dataset.id;
  if (act!=="dellist" && act!=="delphoto" && S.armed) { S.armed=null; }
  const live = S.ready && S.db && S.canWrite;
  switch(act){
    case "tab": ev.preventDefault(); S.tab=el.dataset.tab; S.armed=null; try{history.replaceState(null,"","#"+S.tab);}catch{} render(); scrollTo({top:0}); break;
    case "cat": S.cat=el.dataset.cat; render(); break;
    case "feed": getPicks(false); break;
    case "refine": refineStyle(); break;
    case "stop": S.ctl?.abort(); break;
    case "reload": location.replace(location.pathname+"?v="+encodeURIComponent(S.newer||Date.now())); break;
    case "find": ev.preventDefault(); if(id){ PREVIEW.seen.delete(id); lookupPool([id]); toast("Looking it up…"); } break;
    case "stopbg": ev.preventDefault(); BG.stopped=true; BG.pending=[]; BG.ctl?.abort(); bgNote(); toast("Paused. It picks up again next time you open Sage."); break;
    case "exportdata": { const txt = LS.get("sage.db")||"{}"; try{ await navigator.clipboard.writeText(txt); toast("Backup copied. Paste it into a note to keep it."); }catch{ toast("Couldn't copy. Your browser blocked the clipboard."); } } break;
    case "fav": if(!live) return toast("Open in Claude to save pieces."); { const it=S.items.find(i=>i.id===id); await setItem(id,{status:it.status==="fav"?"new":"fav"}); } break;
    case "no": if(!live) return; await setItem(id,{status:"no"}); toast("Hidden. Future picks will steer away from it."); break;
    case "restore": if(!live) return; await setItem(id,{status:"new"}); break;
    case "addlist": if(!live) return toast("Open in Claude to use lists."); S.sheet=id; renderSheet(); setTimeout(()=>$("#sheetListName")?.focus(),50); break;
    case "closesheet": S.sheet=null; renderSheet(); break;
    case "togglelist": { const it=S.items.find(i=>i.id===S.sheet); const set=new Set(it.lists||[]); el.checked?set.add(el.dataset.list):set.delete(el.dataset.list); await setItem(it.id,{lists:[...set]}); } break;
    case "unlist": { const it=S.items.find(i=>i.id===id); await setItem(id,{lists:(it.lists||[]).filter(x=>x!==el.dataset.list)}); } break;
    case "dellist": { const k="l:"+el.dataset.list; if(S.armed!==k){ S.armed=k; render(); return; } S.armed=null;
      for (const it of S.items.filter(i=>(i.lists||[]).includes(el.dataset.list))) await setItem(it.id,{lists:it.lists.filter(x=>x!==el.dataset.list)});
      try{ await S.db.doc("lists/"+el.dataset.list).delete(); toast("List deleted"); }catch{ toast("Couldn't delete that list."); } } break;
    case "delphoto": { const k="p:"+el.dataset.id; if(S.armed!==k){ S.armed=k; render(); return; } S.armed=null;
      const p=S.photos.find(x=>x.id===el.dataset.id);
      try{ await S.db.doc("photos/"+p.id).delete(); if(p.assetId&&S.assets) S.assets.delete(p.assetId).catch(()=>{}); toast("Photo removed"); }catch{ toast("Couldn't remove that photo."); } } break;
  }
});
document.addEventListener("submit", async ev => {
  const f = ev.target.closest("[data-form]"); if(!f) return; ev.preventDefault();
  const kind = f.dataset.form;
  if (kind!=="settings" && !(S.ready && S.db && S.canWrite)) return;
  if (kind==="settings"){
    const d = Object.fromEntries(new FormData(f).entries());
    LS.set("sage.key",String(d.key||"").trim()); LS.set("sage.model",d.model); LS.set("sage.search",d.search); LS.set("sage.lookupModel",d.lookup||"claude-haiku-5-5");
    setupLocalSample(); toast(S.sample?"Settings saved. Claude is connected.":"Settings saved. Add a key to connect Claude."); render(); if (S.sample){ S.autoFound=false; maybeAuto(); setTimeout(autoFind,300); } return;
  }
  if (kind==="sizes"){
    const d = Object.fromEntries(new FormData(f).entries());
    const sizes = {}; for (const [k] of SIZE_KEYS){ const lo=String(d[k+"-lo"]||""), hi=String(d[k+"-hi"]||""); sizes[k] = !lo ? (hi||"") : (!hi||hi===lo ? lo : `${lo}–${hi}`); } sizes.fit=String(d.fit||"").trim().slice(0,120);
    const num = v => { const n=parseInt(String(v).replace(/[^0-9]/g,""),10); return Number.isFinite(n)?n:null; };
    try{ await saveProfile({sizes,budget:{min:num(d.bmin),max:num(d.bmax)}}); toast("Sizes saved"); }catch{ toast("Couldn't save sizes. Try again."); }
  }
  if (kind==="newlist"||kind==="sheetlist"){
    const inp = f.querySelector("input"); const name = inp.value.trim(); if(!name) return;
    try{
      const ref = await S.db.collection("lists").add({name:name.slice(0,60),createdAt:Date.now()}); inp.value="";
      if (kind==="sheetlist" && S.sheet){ const it=S.items.find(i=>i.id===S.sheet); await setItem(it.id,{lists:[...(it.lists||[]),ref.id]}); }
      toast(`“${name}” created`);
    }catch{ toast("Couldn't create that list."); }
  }
});
document.addEventListener("change", ev => { if (ev.target.id==="photoIn" && ev.target.files?.length) { const fs=[...ev.target.files]; ev.target.value=""; addPhotos(fs); } });
document.addEventListener("keydown", ev => { if (ev.key==="Escape" && S.sheet){ S.sheet=null; renderSheet(); } });


/* ---------- standalone mode (GitHub Pages): local storage + your Claude API key ---------- */
const LS = { get(k){ try{ return localStorage.getItem(k); }catch{ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch{ toast("This browser blocked storage, so changes won't be kept."); } } };
const IMG = new Map();
function imgUrl(id){
  if (!id) return "";
  if (String(id).startsWith("file:")) return String(id).slice(5);
  if (!S.local) return "/_blob/"+id;
  return IMG.get(id) || "";
}
function makeLocalDB(){
  let store = {}; try { store = JSON.parse(LS.get("sage.db")||"{}"); } catch {}
  const subs = new Set();
  const save = () => { LS.set("sage.db",JSON.stringify(store)); for (const f of subs) f(); };
  const rid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const snap = (path) => { const d = store[path]; return {id:path.split("/").pop(),exists:!!d,data:()=>d?JSON.parse(JSON.stringify(d)):undefined,metadata:{fromCache:false,hasPendingWrites:false}}; };
  const docRef = (path) => ({ id:path.split("/").pop(), path,
    get: async()=>snap(path),
    set: async(d)=>{ store[path]=JSON.parse(JSON.stringify(d)); save(); },
    update: async(d)=>{ if(!store[path]) throw {code:"invalid_argument"}; Object.assign(store[path],JSON.parse(JSON.stringify(d))); save(); },
    delete: async()=>{ delete store[path]; save(); },
    onSnapshot(next){ const f=()=>next(snap(path)); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); } });
  const query = (col,ord,lim) => ({
    orderBy:(f,dir="asc")=>query(col,{f,dir},lim), limit:(n)=>query(col,ord,n),
    _docs(){ const pre=col+"/"; let ds=Object.keys(store).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes("/")).map(snap);
      if (ord) ds.sort((a,b)=>{ const x=a.data()[ord.f],y=b.data()[ord.f]; return (x>y?1:x<y?-1:0)*(ord.dir==="desc"?-1:1); });
      return lim?ds.slice(0,lim):ds; },
    async get(){ const docs=this._docs(); return {docs,size:docs.length,empty:!docs.length}; },
    onSnapshot(next){ const f=()=>{ const docs=this._docs(); next({docs,size:docs.length,empty:!docs.length,docChanges:()=>[]}); }; subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); },
    doc:(id)=>docRef(col+"/"+(id||rid())),
    async add(d){ const r=docRef(col+"/"+rid()); await r.set(d); return r; } });
  return { doc:docRef, collection:(c)=>query(c,null,0), _empty:()=>!Object.keys(store).length, _load(obj){ store=obj; save(); } };
}
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("sage-photos",1); r.onupgradeneeded=()=>r.result.createObjectStore("p"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
const LocalAssets = {
  async load(){ try{ const db=await idb(); await new Promise(res=>{ const tx=db.transaction("p").objectStore("p").openCursor(); tx.onsuccess=()=>{ const c=tx.result; if(!c) return res(); IMG.set(c.key,URL.createObjectURL(c.value)); c.continue(); }; tx.onerror=()=>res(); }); }catch{} },
  async upload(blob){ const id="loc"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); const db=await idb();
    await new Promise((res,rej)=>{ const t=db.transaction("p","readwrite"); t.objectStore("p").put(blob,id); t.oncomplete=res; t.onerror=()=>rej({code:"quota_or_state"}); });
    IMG.set(id,URL.createObjectURL(blob)); return {id,url:IMG.get(id)}; },
  async delete(id){ try{ const db=await idb(); db.transaction("p","readwrite").objectStore("p").delete(id); }catch{} IMG.delete(id); return {deleted:true}; }
};
const b64 = blob => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); });
function parseJSON(text){
  const t=String(text||"").trim();
  try { return JSON.parse(t); } catch {}
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) { try { return JSON.parse(fence[1]); } catch {} }
  const i=Math.min(...["{","["].map(c=>{ const k=t.indexOf(c); return k<0?1e9:k; })); const j=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if (i<1e9 && j>i) { try { return JSON.parse(t.slice(i,j+1)); } catch {} }
  throw {code:"invalid_json",text:t};
}
function setupLocalSample(){
  const key = LS.get("sage.key"); S.webSearch = !!key && LS.get("sage.search")!=="0";
  if (!key) { S.sample=null; return; }
  const model = LS.get("sage.model") || "claude-sonnet-5-5";
  const call = async (prompt,opts={}) => {
    const content = [];
    for (const im of (opts.images||[])) content.push({type:"image",source:{type:"base64",media_type:im.type||"image/jpeg",data:await b64(im)}});
    content.push({type:"text",text:prompt+"\n\nYour final message must be only the JSON value requested."});
    const messages=[{role:"user",content}];
    const body = {model:opts.model||model,max_tokens:8000,messages};
    if (opts.search) body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:opts.searchUses||8,user_location:{type:"approximate",country:"US"}}];
    if (opts.search && opts.fetch) body.tools.push({type:"web_fetch_20250910",name:"web_fetch",max_uses:opts.fetch,max_content_tokens:12000});
    let finalText="";
    for (let round=0; round<4; round++){
      let r;
      try { r = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:opts.signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)}); }
      catch(e){ throw {code: e?.name==="AbortError"?"cancelled":"upstream_error"}; }
      const j = await r.json().catch(()=>({}));
      if (!r.ok) throw {code: r.status===401?"bad_key":r.status===429?"rate_limited":r.status===529?"rate_limited":"upstream_error", message:j?.error?.message};
      const blocks = j.content||[];
      let lastTool=-1; blocks.forEach((b,i)=>{ if(/_tool_result$/.test(b.type)) lastTool=i; });
      finalText = blocks.slice(lastTool+1).filter(b=>b.type==="text").map(b=>b.text).join("") || blocks.filter(b=>b.type==="text").map(b=>b.text).join("");
      if (j.stop_reason==="pause_turn") { messages.push({role:"assistant",content:blocks}); continue; }
      break;
    }
    return finalText;
  };
  const fn = async (p,o) => ({text:await call(p,o),truncated:false});
  fn.json = async (p,o) => parseJSON(await call(p,o));
  S.sample = fn;
}
async function localMode(){
  S.local = true; S.offline = false;
  S.db = makeLocalDB(); S.assets = LocalAssets; setupLocalSample();
  await LocalAssets.load();
  checkVersion(); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkVersion(); });
  if (S.db._empty()) { try { const r = await fetch("seed.json"); if (r.ok) S.db._load(await r.json()); } catch {} }
  subscribe();
}

/* ---------- boot ---------- */
const h = (location.hash||"").slice(1); if (["picks","saved","lists","style"].includes(h)) S.tab=h;
window.addEventListener("hashchange",()=>{ const t=location.hash.slice(1); if(["picks","saved","lists","style"].includes(t)&&t!==S.tab){ S.tab=t; render(); } });
render();
(async () => {
  if (!window.claude?.use) { await localMode(); return; }
  const use = n => window.claude.use(n).catch(()=>null);
  [S.db,S.sample,S.assets,S.user] = await Promise.all([use("db"),use("sample"),use("assets"),use("user")]);
  if (!S.db) { S.offline=true; render(); return; }
  try { const w = await S.user?.can?.("data.write"); if (w===false) S.canWrite=false; } catch {}
  subscribe();
})();
})();
